<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Vereinfachte Lagekarte von Italien mit Rom und Ostia</title>
  <desc id="desc">Eine schematische Karte von Italien. Mittelitalien ist hervorgehoben, der Tiber führt zur Stadt Rom, Ostia liegt an der Küste.</desc>
  <rect width="900" height="620" fill="#dce9f2"/>
  <path d="M546 63c-39 17-69 50-96 77-27 27-60 51-77 81-27 49-4 94-24 140-15 36-42 65-49 106-7 36 8 76 38 96 37 26 90 32 116 71 10 16 15 35 13 54l49 0c5-27-1-54-14-78-19-34-53-52-79-72-24-19-44-40-41-74 3-30 25-56 39-82 18-33 22-67 22-104 0-37 18-73 45-99 22-22 52-39 83-61l-25-55z" fill="#f4d49b" stroke="#7a6133" stroke-width="5"/>
  <path d="M456 250c34 8 54 27 60 57 4 22-4 49-1 78 4 42 30 92 44 120" fill="none" stroke="#3383a8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="469" cy="266" r="10" fill="#8f2d18"/>
  <circle cx="496" cy="480" r="10" fill="#1d6b43"/>
  <path d="M495 494c77 26 142 29 237-10" fill="none" stroke="#7b8ea0" stroke-width="3" stroke-dasharray="10 10"/>
