    <text x="486" y="247" font-size="0"> </text>
    <text x="488" y="261" font-size="22"> </text>
    <text x="488" y="287" font-size="22" font-weight="700">Rom</text>
    <text x="510" y="507" font-size="22" font-weight="700">Ostia</text>
    <text x="605" y="491" font-size="20">Tyrrhenisches Meer</text>
    <text x="86" y="76" font-size="22">Didaktische Lagekarte</text>
    <text x="86" y="102" font-size="16">nicht maßstabsgetreu · Fokus auf antike Raumbezüge</text>
  </g>
  <g fill="#fff5e4" stroke="#7a6133" stroke-width="3">
